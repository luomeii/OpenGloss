<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>OpenGloss 配对与标注</title><style>
body{width:320px;padding:16px;font:14px/1.5 system-ui;color:#332b20;background:#fdfaf3}label{display:block;margin:10px 0}input{box-sizing:border-box;width:100%;padding:7px;border:1px solid #cdbb9c;border-radius:6px}button{padding:8px 12px;border:1px solid #ad8b55;background:#fff8e8;border-radius:8px;cursor:pointer}#eng{overflow-wrap:anywhere}small{color:#74644f}
</style></head><body><h3>OpenGloss</h3><button id="pae-toggle">读取设置…</button><p id="state"></p>
<label>引擎地址<input id="pae-base" type="text" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:4815"></label>
<label>本实例配对口令<input id="pae-token" type="password" autocomplete="off" spellcheck="false"></label>
<button id="pae-save">保存并验证配对</button><p id="eng" role="status" aria-live="polite">正在读取设置…</p>
<small>首次使用：启动引擎 → 在引擎管理页复制本实例配对口令 → 填写上方地址和口令 → 保存并验证。引擎运行与配对成功分别验证。</small><script src="popup.js"></script></body></html>
